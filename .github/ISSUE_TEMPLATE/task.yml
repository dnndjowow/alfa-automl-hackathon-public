name: Задача команды
description: Конкретный результат, входные материалы и критерии приёмки
title: "[P0/P1] Краткое название"
body:
  - type: dropdown
    id: owner
    attributes:
      label: Ответственный
      options:
        - Иван
        - Юра
        - Егор / PM
        - Артём
        - Максим
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Цель и что сделать
      description: Какой результат нужен и какие действия входят в задачу.
    validations:
      required: true
  - type: textarea
    id: inputs
    attributes:
      label: Входные файлы и зависимости
      description: Ссылки на материалы, код и задачи, от которых зависит работа.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Пошаговый план
      description: С чего начать, что выполнить по порядку и какой промежуточный результат получить.
      placeholder: "1. ..."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Готово, когда
      description: Проверяемые критерии; приложить команду запуска и ожидаемый результат.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: Срок / ближайшая контрольная точка
      description: Конкретные дата и время по МСК; финальный дедлайн 25.10.2026 20:00. Указать также время начала и предыдущие задачи.
    validations:
      required: true

